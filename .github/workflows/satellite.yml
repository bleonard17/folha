name: Experimental satellite vegetation observations

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/satellite_probe.py
      - tests/test_satellite_probe.py
      - .github/workflows/satellite.yml
  schedule:
    # Every Tuesday during September–December (UTC).
    - cron: '17 7 * 9,10,11,12 2'

permissions:
  contents: write

concurrency:
  group: folha-satellite-data
  cancel-in-progress: true

jobs:
  sample-regions:
    name: Sentinel-2 sampling — ${{ matrix.region }}
    strategy:
      fail-fast: false
      matrix:
        region: [Norte, Centro, Lisboa, Alentejo]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install satellite dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'rasterio>=1.3,<2' 'requests>=2.31,<3' 'pytest>=8,<10'
      - name: Validate analysis
        run: python -m pytest -q tests/test_satellite_probe.py
      - name: Measure representative locations in the region
        run: python scripts/satellite_probe.py --region "${{ matrix.region }}" --output "observations/${{ matrix.region }}.json"
      - name: Publish region measurements to merge job
        uses: actions/upload-artifact@v4
        with:
          name: satellite-region-${{ matrix.region }}
          path: observations/${{ matrix.region }}.json
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Validate and publish all 19 destinations
    needs: sample-regions
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download regional measurement files
        uses: actions/download-artifact@v4
        with:
          pattern: satellite-region-*
          path: observations
          merge-multiple: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure no other commit has moved main
        run: git pull --ff-only origin main
      - name: Merge and validate all four regions
        run: python scripts/satellite_probe.py --merge-dir observations --output data/satellite-observations.json
      - name: Commit verified measurement feed
        run: |
          git config user.name "folha-satellite-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/satellite-observations.json
          if ! git diff --cached --quiet; then
            git commit -m "Update experimental satellite measurements across four regions"
            git push
          fi
