name: Experimental satellite vegetation observations

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/satellite_probe.py
      - tests/test_satellite_probe.py
      - .github/workflows/satellite.yml
  schedule:
    # Weekly each Tuesday during the September–December foliage season (UTC).
    - cron: '17 7 * 9,10,11,12 2'

permissions:
  contents: write

concurrency:
  group: folha-satellite-data
  cancel-in-progress: true

jobs:
  update-observations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install satellite dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'rasterio>=1.3,<2' 'requests>=2.31,<3' 'pytest>=8,<10'
      - name: Test analysis integrity
        run: python -m pytest -q tests/test_satellite_probe.py
      - name: Query satellite imagery and update measurements
        run: python scripts/satellite_probe.py --output data/satellite-observations.json
      - name: Commit measured data, if changed
        run: |
          git config user.name "folha-satellite-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/satellite-observations.json
          if ! git diff --cached --quiet; then
            git commit -m "Update experimental satellite observations"
            git push
          fi